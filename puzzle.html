<!DOCTYPE html>
<html>
<head>
  <title>Solve the Puzzle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { text-align: center; font-family: sans-serif; padding: 20px; }
    input, button { padding: 10px; font-size: 1rem; margin: 10px; width: 80%; max-width: 300px; }
  </style>
</head>
<body>
  <h1>Solve This Puzzle</h1>
  <p id="question">Loading puzzle...</p>
  <input type="text" id="answer" placeholder="Type your answer here">
  <br>
  <button onclick="checkAnswer()">Submit</button>
  <p id="feedback"></p>

  <script>
    const puzzles = [
  { question: "I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?", answer: "echo" },
  { question: "What has keys but can’t open locks?", answer: "piano" },
  { question: "What gets wetter the more it dries?", answer: "towel" },
  { question: "I’m tall when I’m young, and I’m short when I’m old. What am I?", answer: "candle" },
  { question: "Forward I am heavy, but backward I am not. What am I?", answer: "ton" },
  { question: "What has to be broken before you can use it?", answer: "egg" },
  { question: "What has a face and two hands but no arms or legs?", answer: "clock" },
  { question: "What is always in front of you but can’t be seen?", answer: "future" },
  { question: "What can travel around the world while staying in the same corner?", answer: "stamp" },
  { question: "What comes once in a minute, twice in a moment, but never in a thousand years?", answer: "m" },
  { question: "The more of me you take, the more you leave behind. What am I?", answer: "footsteps" },
  { question: "What has a neck but no head?", answer: "bottle" },
  { question: "What kind of room has no doors or windows?", answer: "mushroom" },
  { question: "What has an eye but cannot see?", answer: "needle" },
  { question: "If you drop me I’m sure to crack, but give me a smile and I’ll smile back. What am I?", answer: "mirror" },
  { question: "What invention lets you look right through a wall?", answer: "window" },
  { question: "What runs around a house but doesn’t move?", answer: "fence" },
  { question: "I go up but never down. What am I?", answer: "age" },
  { question: "You see a boat filled with people, but there isn’t a single person on board. How?", answer: "they are all married" },
  { question: "What comes down but never goes up?", answer: "rain" }
];

    let currentAnswer = "";

    function generatePuzzle() {
      const puzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
      currentAnswer = puzzle.answer.toLowerCase();
      document.getElementById("question").innerText = puzzle.question;
    }

    function checkAnswer() {
      const userAnswer = document.getElementById("answer").value.trim().toLowerCase();
      if (userAnswer === currentAnswer) {
        window.location.href = "unlock.html";
      } else {
        document.getElementById("feedback").innerText = "Wrong! Try again.";
      }
    }

    generatePuzzle();
  </script>
</body>
</html>
